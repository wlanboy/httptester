[project]
name = "httptester"
version = "0.1.0"
description = "http tester tool for get and dns requests"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning:starlette.testclient",
]
