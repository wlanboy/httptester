[project]
name = "httptester"
version = "0.1.0"
description = "http tester tool for get and dns requests"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121.0",
    "pydantic>=2.12.3",
    "requests>=2.32.4",
    "urllib3>=2.6.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "httpx2>=2.10.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning:starlette.testclient",
]
