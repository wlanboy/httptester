{{- if and (eq .Values.ingress.controller "istio") (.Capabilities.APIVersions.Has "networking.istio.io/v1alpha3") }}
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ .Values.deploymentName }}-gateway
  namespace: {{ .Values.namespace }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . }}
        {{- end }}
{{- end }}
